name: Update Discord corpus

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update-corpus:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      OPENMOWER_GUILD_ID: ${{ secrets.OPENMOWER_GUILD_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Attachment bytes live in a separate repository as ordinary Git objects,
      # so they carry no Git LFS bandwidth budget. ATTACHMENTS_TOKEN needs write
      # access to it; without the secret this job cannot publish new files.
      - name: Check out attachments mirror
        uses: actions/checkout@v4
        with:
          repository: jeremysalwen/OpenMowerBot-attachments
          token: ${{ secrets.ATTACHMENTS_TOKEN }}
          path: attachments-mirror

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download DiscordChatExporter
        run: |
          set -euo pipefail
          mkdir -p .cache/dce
          python3 - <<'PY' > .cache/dce/url.txt
          import json
          import urllib.request

          url = "https://api.github.com/repos/Tyrrrz/DiscordChatExporter/releases/latest"
          with urllib.request.urlopen(url) as response:
              release = json.load(response)

          for asset in release["assets"]:
              if asset["name"] == "DiscordChatExporter.Cli.linux-x64.zip":
                  print(asset["browser_download_url"])
                  break
          else:
              raise SystemExit("DiscordChatExporter.Cli.linux-x64.zip not found")
          PY
          curl -L "$(cat .cache/dce/url.txt)" -o .cache/dce/dce.zip
          unzip -q .cache/dce/dce.zip -d .cache/dce
          chmod +x .cache/dce/DiscordChatExporter.Cli

      - name: Export incremental Discord history
        run: |
          node ./bin/discord-history.mjs export \
            --incremental \
            --raw data/raw-incremental/latest \
            --exporter .cache/dce/DiscordChatExporter.Cli \
            --parallel 1 \
            --retries 2 \
            --retry-delay-seconds 60

      - name: Build incremental corpus
        run: |
          node ./bin/discord-history.mjs build-corpus \
            --raw data/raw-incremental/latest \
            --out data/corpus-incremental \
            --allow-empty

      - name: Merge corpus
        run: |
          node ./bin/discord-history.mjs merge-corpus \
            --base data/corpus \
            --delta data/corpus-incremental \
            --out data/corpus

      - name: Download selected attachments
        # Refreshes expired Discord CDN URLs via the API (DISCORD_TOKEN above)
        # before fetching. Only files the mirror does not already hold are
        # downloaded; rosbags bypass the size cap.
        run: |
          node ./bin/discord-history.mjs download-attachments \
            --corpus data/corpus \
            --out attachments-mirror \
            --max-size 1049600

      # Attachments the archive already held before the move off Git LFS, whose
      # objects are stranded behind the exhausted LFS budget. Discord re-signs
      # their expired URLs while the original message still exists, so these are
      # recovered from Discord and verified against the recorded LFS checksum.
      - name: Recover stranded attachments
        run: |
          node ./bin/discord-history.mjs recover-attachments \
            --corpus data/corpus \
            --manifest attachments-mirror/MISSING.tsv \
            --out attachments-mirror

      - name: Update attachments index
        run: |
          node ./bin/discord-history.mjs write-attachment-index \
            --mirror attachments-mirror \
            --missing attachments-mirror/MISSING.tsv

      - name: Commit attachments mirror
        working-directory: attachments-mirror
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No attachment changes."
          else
            git commit -m "Add attachments from Discord corpus update"
            git push
          fi

      - name: Show corpus stats
        run: node ./bin/discord-history.mjs stats --corpus data/corpus

      - name: Commit updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corpus
          if git diff --cached --quiet; then
            echo "No corpus changes."
          else
            git commit -m "Update Discord corpus"
            git push
          fi
